[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-ai-readiness"
version = "0.2.0"
description = "Evidence-based production readiness audits for AI and LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Uzair Khatri"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
production-ai-readiness = "production_ai_readiness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
